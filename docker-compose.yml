# Local development database: Postgres 16 with the pgvector extension.
# In production, use a Supabase project (pgvector is built in) and point DATABASE_URL at it.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya
      POSTGRES_DB: nyaya
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
